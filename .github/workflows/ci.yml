name: Verify MCP server
on:
  push:
    branches: [main, remote-task-management, remote-hardening, mini-reliability-20261021]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
